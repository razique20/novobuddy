<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Upper Loop Gradient: Cosmic Violet & Neon Purple (NOVA Primary) -->
    <linearGradient id="orbitUpperGrad" x1="15%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="30%" stop-color="#7C3AED" />
      <stop offset="65%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Lower Loop Gradient: Deep Cobalt to Electric Cyan (NOVA Accent) -->
    <linearGradient id="orbitLowerGrad" x1="5%" y1="100%" x2="95%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="35%" stop-color="#2563EB" />
      <stop offset="70%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Upper Core Radial Glow (Cosmic Violet Orb) -->
    <radialGradient id="coreUpperGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="30%" stop-color="#C084FC" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#581C87" />
    </radialGradient>

    <!-- Lower Core Radial Glow (Quantum Cyan Orb) -->
    <radialGradient id="coreLowerGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F0FDFF" />
      <stop offset="30%" stop-color="#67E8F9" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </radialGradient>

    <filter id="novaDropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#09090D" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Lower Orbital Loop (Electric Blue to Cyan) -->
  <!-- Center: (42, 62). Sweeps counter-clockwise from right through bottom to top-left -->
  <path
    d="M 67.5 59
       A 26 26 0 1 1 39 36.5
       L 40.5 48.5
       A 14 14 0 1 0 55.5 60.5
       Z"
    fill="url(#orbitLowerGrad)"
    filter="url(#novaDropShadow)"
  />

  <!-- Upper Orbital Loop (Cosmic Violet) -->
  <!-- Center: (58, 38). Sweeps clockwise from left through top to bottom-right -->
  <path
    d="M 32.5 41
       A 26 26 0 1 1 61 63.5
       L 59.5 51.5
       A 14 14 0 1 0 44.5 39.5
       Z"
    fill="url(#orbitUpperGrad)"
    filter="url(#novaDropShadow)"
  />

  <!-- Lower Core Planetary Sphere -->
  <circle cx="42" cy="62" r="9.5" fill="url(#coreLowerGrad)" />
  <circle cx="39.5" cy="59.5" r="3.5" fill="#FFFFFF" opacity="0.8" />

  <!-- Upper Core Planetary Sphere -->
  <circle cx="58" cy="38" r="9.5" fill="url(#coreUpperGrad)" />
  <circle cx="55.5" cy="35.5" r="3.5" fill="#FFFFFF" opacity="0.85" />
</svg>
